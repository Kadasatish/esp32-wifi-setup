name: Build ESP32 WiFi firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Collect flash binaries
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=".pio/build/esp32dev"
          mkdir -p flash-bundle
          cp "$BUILD_DIR/bootloader.bin" flash-bundle/bootloader.bin
          cp "$BUILD_DIR/partitions.bin" flash-bundle/partitions.bin
          cp "$BUILD_DIR/firmware.bin" flash-bundle/firmware.bin
          BOOT_APP0="$(find "$HOME/.platformio" -type f -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" flash-bundle/boot_app0.bin

          # Build the exact ESP-IDF v4.4.7 default ESP32 PHY init partition
          # from Espressif's official source header (Arduino-ESP32 2.0.17 base).
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/espressif/esp-idf/v4.4.7/components/esp_phy/esp32/include/phy_init_data.h \
            --output /tmp/phy_init_data.h
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path("/tmp/phy_init_data.h").read_text()
          match = re.search(r"phy_init_data\s*=\s*\{\s*\{(.*?)\}\s*\};", source, re.S)
          if not match:
              raise SystemExit("Could not parse Espressif PHY init data source")
          body = re.sub(
              r"LIMIT\(([^,]+),\s*([^,]+),\s*([^)]+)\)",
              lambda m: str(max(int(m.group(2).strip()), min(int(m.group(1).strip().replace("CONFIG_ESP_PHY_MAX_TX_POWER * 4", "80")), int(m.group(3).strip())))),
              match.group(1),
          )
          values = []
          for raw in body.split(","):
              token = raw.strip()
              if not token:
                  continue
              value = int(token, 0)
              if not 0 <= value <= 255:
                  raise SystemExit(f"PHY byte out of range: {token}")
              values.append(value)
          if len(values) != 128:
              raise SystemExit(f"Expected 128 PHY bytes, got {len(values)}")
          payload = b"PHYINIT" + bytes(values) + b"PHYINIT"
          if len(payload) != 142:
              raise SystemExit(f"Unexpected PHY image length: {len(payload)}")
          Path("flash-bundle/phy_init_data.bin").write_bytes(payload)
          print(f"Created official ESP32 PHY init image: {len(payload)} bytes")
          PY

          cat > flash-bundle/FLASH-ADDRESSES.txt <<'EOF'
          ESP32 DevKit V1 / ESP-WROOM-32
          bootloader.bin     0x1000
          partitions.bin    0x8000
          boot_app0.bin     0xE000
          phy_init_data.bin 0xF000
          firmware.bin      0x10000
          Select chip ESP32 and baud 115200 in the flasher.
          Do not erase first. Flash all five BIN files at the listed offsets.
          EOF
          cd flash-bundle
          zip -j ../esp32-wifi-setup-binaries.zip ./*

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: esp32-wifi-setup-binaries
          path: esp32-wifi-setup-binaries.zip
          if-no-files-found: error
